<!doctype html>
<html lang="et">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Õhtuleht värvid</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root { --red: #F50000; --ink-950: #2A2A2D; --ink-800: #545459; --ink-200: #DFDFE2; --ink-50: #F7F7F8; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--ink-50); color: var(--ink-950); font: 400 16px/1.5 Inter, Arial, sans-serif; }
    main { max-width: 1024px; margin: 0 auto; padding: 32px 16px 64px; }
    .eyebrow { margin: 0; font-size: 12px; font-weight: 500; letter-spacing: 1.2px; text-transform: uppercase; color: var(--red); }
    h1 { margin: 4px 0 8px; font: 500 36px/1.25 'Fira Sans', Arial, sans-serif; }
    .lead { margin: 0 0 32px; color: var(--ink-800); }
    section { margin-bottom: 32px; }
    h2 { margin: 0; font: 500 24px/1.25 'Fira Sans', Arial, sans-serif; }
    .note { margin: 4px 0 12px; color: var(--ink-800); font-size: 14px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; padding: 12px; background: #fff; border: 1px solid var(--ink-200); border-radius: 12px; }
    .swatch { display: flex; flex-direction: column; gap: 8px; padding: 0; border: 0; background: none; font: inherit; text-align: left; cursor: pointer; }
    .chip { height: 72px; border-radius: 4px; border: 1px solid rgba(0, 0, 0, .06); transition: transform .1s; }
    .swatch:hover .chip { transform: translateY(-2px); }
    .swatch:focus-visible { outline: 2px solid var(--ink-950); outline-offset: 2px; border-radius: 4px; }
    .step { font: 500 12px/1 'Courier New', monospace; }
    .hex { font: 400 12px/1 'Courier New', monospace; color: #67686F; }
    #toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 16px); padding: 10px 16px; border-radius: 8px; background: var(--ink-950); color: #fff; font-size: 14px; opacity: 0; pointer-events: none; transition: .2s; }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }
    @media (min-width: 900px) { .grid { grid-template-columns: repeat(11, 1fr); } }
    @media (max-width: 480px) { h1 { font-size: 28px; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Visuaalne identiteet</p>
    <h1>Õhtuleht värvid</h1>
    <p class="lead">Klõpsa värvil, et kopeerida selle HEX-kood ilma # märgita.</p>
    <div id="app"></div>
  </main>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="colors.js"></script>
  <script>
    const app = document.getElementById('app');
    const toast = document.getElementById('toast');
    let timer;

    function show(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(timer);
      timer = setTimeout(() => toast.classList.remove('show'), 1600);
    }

    // navigator.clipboard needs a secure page (https); the fallback covers http and old browsers.
    async function copy(text) {
      try {
        await navigator.clipboard.writeText(text);
      } catch (e) {
        const t = document.createElement('textarea');
        t.value = text;
        t.style.position = 'fixed';
        t.style.opacity = '0';
        document.body.appendChild(t);
        t.select();
        document.execCommand('copy');
        t.remove();
      }
      show('Kopeeritud ' + text);
    }

    for (const p of window.PALETTES) {
      const s = document.createElement('section');
      s.innerHTML = `<h2></h2><p class="note"></p><div class="grid"></div>`;
      s.querySelector('h2').textContent = p.name;
      s.querySelector('.note').textContent = p.note;
      const grid = s.querySelector('.grid');
      for (const [step, hex] of p.colors) {
        const b = document.createElement('button');
        b.className = 'swatch';
        b.type = 'button';
        b.setAttribute('aria-label', `${p.name} ${step}, kopeeri ${hex}`);
        b.innerHTML = `<span class="chip" style="background:${hex}"></span><span class="step">${step}</span><span class="hex">${hex}</span>`;
        b.addEventListener('click', () => copy(hex.replace('#', '')));
        grid.appendChild(b);
      }
      app.appendChild(s);
    }
  </script>
</body>
</html>
